<div class="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-lg shadow-lg p-4 mb-4 animate-pulse-slow">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-white/20 rounded-full p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h3 class="font-bold text-lg">Nuevo Incidente</h3>
        <p class="text-sm opacity-90">{{ asignacionPendiente.incidente.especialidad_ia || 'Sin categoría' }}</p>
      </div>
    </div>
    
    <div class="text-right">
      <div class="text-3xl font-bold tabular-nums">{{ formatTime(tiempoRestante()) }}</div>
      <div class="text-xs opacity-90">Tiempo restante</div>
    </div>
  </div>

  <div class="mt-3 flex items-center gap-2">
    <span [class]="getColorPrioridad(asignacionPendiente.incidente.prioridad)" class="px-2 py-1 rounded-full text-xs font-semibold">
      {{ getLabelPrioridad(asignacionPendiente.incidente.prioridad) }}
    </span>
    <span class="text-sm">
      {{ asignacionPendiente.incidente.cliente.nombre }}
    </span>
  </div>

  <div class="mt-4 flex gap-2">
    <button (click)="onAceptar()" class="flex-1 bg-white text-green-600 font-semibold py-2 px-4 rounded-lg hover:bg-green-50 transition">
      Aceptar
    </button>
    <button (click)="onRechazar()" class="flex-1 bg-white/20 text-white font-semibold py-2 px-4 rounded-lg hover:bg-white/30 transition">
      Rechazar
    </button>
    <button (click)="onVerDetalles()" class="bg-white/20 text-white font-semibold py-2 px-4 rounded-lg hover:bg-white/30 transition">
      Ver Detalles
    </button>
  </div>
</div>
