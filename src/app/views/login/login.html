<div class="min-h-screen flex items-center justify-center bg-surface dark:bg-[#191c1e] px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-on-surface dark:text-white">Bienvenido a Auxia</h1>
      <p class="text-on-surface-variant dark:text-gray-400 mt-2">Inicia sesión para continuar</p>
    </div>

    @if (error()) {
      <div class="bg-error/10 text-error p-4 rounded-lg mb-6 text-sm">
        {{ error() }}
      </div>
    }

    <form
      (ngSubmit)="onSubmit()"
      class="bg-surface-container-lowest dark:bg-[#2e3133] p-8 rounded-xl-plus shadow-lg"
    >
      <div class="space-y-6">
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Usuario</label
          >
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="tu usuario"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Contraseña</label
          >
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="authService.loading()"
          class="w-full py-3 px-4 bg-primary text-white font-semibold rounded-xl-plus shadow-md hover:opacity-90 transition-all disabled:opacity-50"
        >
          {{ authService.loading() ? 'Iniciando...' : 'Iniciar sesión' }}
        </button>
      </div>
    </form>

    <div class="text-center mt-6">
      <p class="text-on-surface-variant dark:text-gray-400 text-sm">
        ¿No tienes cuenta?
        <a routerLink="/register" class="text-primary font-semibold hover:underline">Regístrate</a>
      </p>
    </div>
  </div>
</div>
