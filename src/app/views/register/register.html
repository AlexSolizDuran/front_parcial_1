<div class="min-h-screen flex items-center justify-center bg-surface dark:bg-[#191c1e] px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-on-surface dark:text-white">Crear cuenta en Auxia</h1>
      <p class="text-on-surface-variant dark:text-gray-400 mt-2">Regístrate para comenzar</p>
    </div>

    @if (error()) {
      <div class="bg-error/10 text-error p-4 rounded-lg mb-6 text-sm">
        {{ error() }}
      </div>
    }

    @if (success()) {
      <div class="bg-green-100 text-green-800 p-4 rounded-lg mb-6 text-sm">
        {{ success() }}
      </div>
    }

    <form
      (ngSubmit)="onSubmit()"
      class="bg-surface-container-lowest dark:bg-[#2e3133] p-8 rounded-xl-plus shadow-lg"
    >
      <div class="space-y-5">
        <div>
          <label for="nombre" class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Nombre completo</label
          >
          <input
            type="text"
            id="nombre"
            [(ngModel)]="nombre"
            name="nombre"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Juan Pérez"
          />
        </div>

        <div>
          <label
            for="username"
            class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Usuario</label
          >
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="juanperez"
          />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Correo electrónico</label
          >
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="tu@email.com"
          />
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Teléfono (opcional)</label
          >
          <input
            type="tel"
            id="phone"
            [(ngModel)]="phone"
            name="phone"
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="+51 999 999 999"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Contraseña</label
          >
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="••••••••"
          />
        </div>

        <div>
          <label
            for="confirmPassword"
            class="block text-sm font-medium text-on-surface dark:text-white mb-2"
            >Confirmar contraseña</label
          >
          <input
            type="password"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            class="w-full px-4 py-3 rounded-lg border border-outline-variant dark:border-gray-600 bg-surface-container-lowest dark:bg-[#191c1e] text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="authService.loading()"
          class="w-full py-3 px-4 bg-primary text-white font-semibold rounded-xl-plus shadow-md hover:opacity-90 transition-all disabled:opacity-50"
        >
          {{ authService.loading() ? 'Registrando...' : 'Crear cuenta' }}
        </button>
      </div>
    </form>

    <div class="text-center mt-6">
      <p class="text-on-surface-variant dark:text-gray-400 text-sm">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-primary font-semibold hover:underline">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
