<div class="bg-white dark:bg-[#2e3133] rounded-lg shadow-sm p-4 sm:p-6 mb-4 sm:mb-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
    <div>
      <h2 class="text-base sm:text-lg font-semibold text-on-surface dark:text-white">
        Reporte de Pagos
      </h2>
      <p class="text-xs sm:text-sm text-on-surface-variant dark:text-gray-400 mt-1">
        Genere un reporte PDF con el historial de pagos del taller
      </p>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 items-end">
    <div class="flex-1 w-full sm:w-auto">
      <label class="block text-xs font-medium text-on-surface-variant dark:text-gray-400 mb-1">
        Fecha Desde (opcional)
      </label>
      <input
        type="date"
        [ngModel]="fechaDesde()"
        (ngModelChange)="fechaDesde.set($event)"
        class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-[#191c1e] border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
      />
    </div>

    <div class="flex-1 w-full sm:w-auto">
      <label class="block text-xs font-medium text-on-surface-variant dark:text-gray-400 mb-1">
        Fecha Hasta (opcional)
      </label>
      <input
        type="date"
        [ngModel]="fechaHasta()"
        (ngModelChange)="fechaHasta.set($event)"
        class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-[#191c1e] border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
      />
    </div>

    <button
      (click)="generarReporte()"
      [disabled]="loading()"
      class="w-full sm:w-auto px-6 py-2 bg-primary hover:bg-primary/90 disabled:bg-gray-400 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2"
    >
      @if (loading()) {
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Generando...
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Generar PDF
      }
    </button>
  </div>

  @if (error()) {
    <div class="mt-3 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
      <p class="text-xs sm:text-sm text-red-600 dark:text-red-400">{{ error() }}</p>
    </div>
  }
</div>
